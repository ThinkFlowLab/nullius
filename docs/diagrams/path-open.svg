<path d="M204,232 L436,232" fill="none" stroke="#596471" marker-end="url(#path-open-arrow)" class="arrow"/>
<path d="M444,272 L560,272" fill="none" stroke="#596471" stroke-dasharray="5 4" marker-end="url(#path-open-arrow)" class="arrow dashed"/>
<path d="M80,312 L196,312" fill="none" stroke="#596471" marker-end="url(#path-open-arrow)" class="arrow"/>
<path d="M204,352 L560,352" fill="none" stroke="#596471" marker-end="url(#path-open-arrow)" class="arrow"/>
