<rect x="140" y="24" width="120" height="48" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="200" y="46" text-anchor="middle" class="name">Runs pages</text>
<text x="200" y="60" text-anchor="middle" class="sub">web/runs</text>
