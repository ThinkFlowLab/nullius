<text x="440" y="46" text-anchor="middle" class="name">Parser</text>
<text x="440" y="60" text-anchor="middle" class="sub">parse, classify</text>
<rect x="500" y="24" width="120" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="500" y="24" width="120" height="48" rx="6" fill="#e0e1e3" stroke="#596471" class="store"/>
<text x="560" y="46" text-anchor="middle" class="name">Workspace</text>
<text x="560" y="60" text-anchor="middle" class="sub">workspaces/&lt;name&gt;/</text>
<line x1="24" y1="396" x2="616" y2="396" stroke="#d6d7d9" class="rule"/>
<text x="24" y="416" text-anchor="start" class="eyebrow">LEGEND</text>
<path d="M96,413 L124,413" fill="none" stroke="#596471" marker-end="url(#path-open-arrow)" class="arrow"/>
