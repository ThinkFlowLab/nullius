<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-labelledby="builder-run-title builder-run-desc" class="dg">
<title id="builder-run-title">Run</title>
<desc id="builder-run-desc">The page posts the recipe, Nullius checks what the runner needs of the machine, prepares the target, runs each part detached while polling it, pauses on a failure, then shows the job.</desc>
<defs><marker id="builder-run-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#596471" class="head"/></marker><marker id="builder-run-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#36577d" class="head accent"/></marker><marker id="builder-run-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#596471" stroke-width="1.2" class="arrow"/></marker></defs>
<style>
.dg{--p:var(--paper,#f7f8fa);--i:var(--ink,#25282e);--m:var(--muted,#596471);--a:var(--md-typeset-a-color,#36577d);--n:#fff;
 --sans:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'Instrument Serif',Georgia,serif}
[data-md-color-scheme=slate] .dg{--n:color-mix(in srgb,var(--i) 7%,var(--p))}
.dg .paper{fill:var(--p)}
.dg .zone{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 14%,transparent);stroke-width:.8}
.dg .eyebrow{fill:var(--m);font:500 8px var(--mono);letter-spacing:.14em}
.dg .box{fill:var(--n);stroke:var(--i);stroke-width:1}
.dg .focal{fill:color-mix(in srgb,var(--a) 12%,transparent);stroke:var(--a);stroke-width:1}
.dg .store{fill:color-mix(in srgb,var(--i) 5%,transparent);stroke:var(--m);stroke-width:1}
.dg .ext{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 40%,transparent);stroke-width:1}
.dg .input{fill:color-mix(in srgb,var(--m) 10%,transparent);stroke:var(--m);stroke-width:1}
.dg .name{fill:var(--i);font:500 12px var(--sans)}
.dg .sub{fill:var(--m);font:9px var(--mono)}
.dg .lbl{fill:var(--m);font:8px var(--mono);letter-spacing:.06em}
.dg .lbl.accent{fill:var(--a)}
.dg .arrow{fill:none;stroke:var(--m);stroke-width:1.2}
.dg .arrow.accent{stroke:var(--a)}
.dg .arrow.dashed{stroke-dasharray:5 4;stroke-width:1}
.dg .arrow.bus{stroke-width:1}
.dg .head{fill:var(--m)}
.dg .head.accent{fill:var(--a)}
.dg .dot{fill:var(--i)}
.dg .life{stroke:color-mix(in srgb,var(--i) 25%,transparent);stroke-width:1;stroke-dasharray:3 3}
.dg .act{fill:color-mix(in srgb,var(--i) 6%,transparent);stroke:var(--m);stroke-width:.8}
.dg .frame{fill:color-mix(in srgb,var(--i) 2%,transparent);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .tab{fill:var(--p);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .guard{fill:var(--m);font:8px var(--mono);letter-spacing:.04em}
.dg .note{fill:var(--m);font:13px var(--sans)}
.dg .rule{stroke:color-mix(in srgb,var(--i) 12%,transparent);stroke-width:.8}
.dg .legend{fill:var(--m);font:9px var(--sans)}
</style>
<rect width="100%" height="100%" fill="#f7f8fa" class="paper"/>
<line x1="120" y1="72" x2="120" y2="552" stroke="#b4b5b8" stroke-dasharray="3 3" class="life"/>
<line x1="360" y1="72" x2="360" y2="552" stroke="#b4b5b8" stroke-dasharray="3 3" class="life"/>
<line x1="600" y1="72" x2="600" y2="552" stroke="#b4b5b8" stroke-dasharray="3 3" class="life"/>
<rect x="356" y="104" width="8" height="444" fill="#e0e1e3" stroke="#596471" class="act"/>
<rect x="596" y="224" width="8" height="120" fill="#e0e1e3" stroke="#596471" class="act"/>
<rect x="96" y="264" width="588" height="240" rx="4" fill="#e7e7e9" stroke="#b9babd" class="frame"/>
<rect x="96" y="264" width="40" height="16" rx="2" fill="#f7f8fa" stroke="#b9babd" class="tab"/>
<text x="116" y="276" text-anchor="middle" class="eyebrow">LOOP</text>
<text x="108" y="296" text-anchor="start" class="guard">[nop, oracle, then the agents]</text>
<rect x="104" y="392" width="340" height="96" rx="4" fill="#e7e7e9" stroke="#b9babd" class="frame"/>
<rect x="104" y="392" width="40" height="16" rx="2" fill="#f7f8fa" stroke="#b9babd" class="tab"/>
<text x="124" y="404" text-anchor="middle" class="eyebrow">OPT</text>
<text x="116" y="424" text-anchor="start" class="guard">[a part failed, more to come]</text>
<path d="M120,112 L356,112" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M364,136 L380,136 Q388,136 388,144 L388,144 Q388,152 380,152 L368,152" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M364,176 L380,176 Q388,176 388,184 L388,184 Q388,192 380,192 L368,192" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M364,232 L596,232" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M364,320 L596,320" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M364,344 L380,344 Q388,344 388,352 L388,352 Q388,360 380,360 L368,360" fill="none" stroke="#596471" stroke-dasharray="5 4" marker-end="url(#builder-run-arrow)" class="arrow dashed"/>
<path d="M356,456 L120,456" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<path d="M356,536 L120,536" fill="none" stroke="#36577d" marker-end="url(#builder-run-accent)" class="arrow accent"/>
<rect x="152" y="92" width="172" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="238" y="102" text-anchor="middle" class="lbl">POST /RUN · SCRIPT, PARTS, RECIPE</text>
<rect x="396" y="138" width="124" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="400" y="148" text-anchor="start" class="lbl">HERE: DOCKER PS ANSWERS</text>
<rect x="396" y="178" width="108" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="400" y="188" text-anchor="start" class="lbl">RUNNER PREPARED ONCE</text>
<rect x="394" y="212" width="172" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="480" y="222" text-anchor="middle" class="lbl">SSH: DOCKER, UV · THE RUNNER SENT</text>
<rect x="378" y="300" width="204" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="480" y="310" text-anchor="middle" class="lbl">RUN-&lt;PART&gt;.SH DETACHED · PID, EXIT FILE</text>
<rect x="396" y="346" width="172" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="400" y="356" text-anchor="start" class="lbl">EVERY 10 S: LOG TAIL, RSYNC JOBS/</text>
<rect x="176" y="436" width="124" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="238" y="446" text-anchor="middle" class="lbl">PAUSE: CONTINUE OR STOP</text>
<rect x="164" y="516" width="148" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="238" y="526" text-anchor="middle" class="lbl accent">JOB PAGE: RUN LOG, THEN LIVE</text>
<rect x="60" y="24" width="120" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="60" y="24" width="120" height="48" rx="6" fill="#dedfe1" stroke="#596471" class="input"/>
<text x="120" y="46" text-anchor="middle" class="name">Page</text>
<text x="120" y="60" text-anchor="middle" class="sub">the builder</text>
<rect x="288" y="24" width="144" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="288" y="24" width="144" height="48" rx="6" fill="#e8edf4" stroke="#36577d" class="focal"/>
<text x="360" y="46" text-anchor="middle" class="name">Nullius</text>
<text x="360" y="60" text-anchor="middle" class="sub">web/execute, execution</text>
<rect x="540" y="24" width="120" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="540" y="24" width="120" height="48" rx="6" fill="#e4e5e7" stroke="#7a7c80" class="ext"/>
<text x="600" y="46" text-anchor="middle" class="name">Target</text>
<text x="600" y="60" text-anchor="middle" class="sub">here, or a host</text>
<line x1="24" y1="564" x2="696" y2="564" stroke="#d6d7d9" class="rule"/>
<text x="24" y="584" text-anchor="start" class="eyebrow">LEGEND</text>
<path d="M96,581 L124,581" fill="none" stroke="#596471" marker-end="url(#builder-run-arrow)" class="arrow"/>
<text x="130" y="585" text-anchor="start" class="legend">Call</text>
<path d="M175,581 L203,581" fill="none" stroke="#596471" stroke-dasharray="5 4" marker-end="url(#builder-run-arrow)" class="arrow dashed"/>
<text x="209" y="585" text-anchor="start" class="legend">Poll</text>
<path d="M254,581 L282,581" fill="none" stroke="#36577d" marker-end="url(#builder-run-accent)" class="arrow accent"/>
<text x="288" y="585" text-anchor="start" class="legend">What you see</text>
<rect x="376" y="574" width="20" height="14" rx="2" fill="#e7e7e9" stroke="#b9babd" class="frame"/>
<text x="398" y="585" text-anchor="start" class="legend">Fragment</text>
</svg>
