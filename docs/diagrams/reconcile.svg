<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 296" width="640" height="296" role="img" aria-labelledby="reconcile-title reconcile-desc" class="dg">
<title id="reconcile-title">Reconcile</title>
<desc id="reconcile-desc">The recorded outcome and the judged failure cause either agree, disagree ranked by confidence, or, with no outcome, leave a suggestion that is never written back.</desc>
<defs><marker id="reconcile-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#596471" class="head"/></marker><marker id="reconcile-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#36577d" class="head accent"/></marker><marker id="reconcile-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#596471" stroke-width="1.2" class="arrow"/></marker></defs>
<style>
.dg{--p:var(--paper,#f7f8fa);--i:var(--ink,#25282e);--m:var(--muted,#596471);--a:var(--md-typeset-a-color,#36577d);--n:#fff;
 --sans:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'Instrument Serif',Georgia,serif}
[data-md-color-scheme=slate] .dg{--n:color-mix(in srgb,var(--i) 7%,var(--p))}
.dg .paper{fill:var(--p)}
.dg .zone{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 14%,transparent);stroke-width:.8}
.dg .eyebrow{fill:var(--m);font:500 8px var(--mono);letter-spacing:.14em}
.dg .box{fill:var(--n);stroke:var(--i);stroke-width:1}
.dg .focal{fill:color-mix(in srgb,var(--a) 12%,transparent);stroke:var(--a);stroke-width:1}
.dg .store{fill:color-mix(in srgb,var(--i) 5%,transparent);stroke:var(--m);stroke-width:1}
.dg .ext{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 40%,transparent);stroke-width:1}
.dg .input{fill:color-mix(in srgb,var(--m) 10%,transparent);stroke:var(--m);stroke-width:1}
.dg .name{fill:var(--i);font:500 12px var(--sans)}
.dg .sub{fill:var(--m);font:9px var(--mono)}
.dg .lbl{fill:var(--m);font:8px var(--mono);letter-spacing:.06em}
.dg .lbl.accent{fill:var(--a)}
.dg .arrow{fill:none;stroke:var(--m);stroke-width:1.2}
.dg .arrow.accent{stroke:var(--a)}
.dg .arrow.dashed{stroke-dasharray:5 4;stroke-width:1}
.dg .arrow.bus{stroke-width:1}
.dg .head{fill:var(--m)}
.dg .head.accent{fill:var(--a)}
.dg .dot{fill:var(--i)}
.dg .life{stroke:color-mix(in srgb,var(--i) 25%,transparent);stroke-width:1;stroke-dasharray:3 3}
.dg .act{fill:color-mix(in srgb,var(--i) 6%,transparent);stroke:var(--m);stroke-width:.8}
.dg .frame{fill:color-mix(in srgb,var(--i) 2%,transparent);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .tab{fill:var(--p);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .guard{fill:var(--m);font:8px var(--mono);letter-spacing:.04em}
.dg .note{fill:var(--m);font:13px var(--sans)}
.dg .rule{stroke:color-mix(in srgb,var(--i) 12%,transparent);stroke-width:.8}
.dg .legend{fill:var(--m);font:9px var(--sans)}
</style>
<rect width="100%" height="100%" fill="#f7f8fa" class="paper"/>
<path d="M184,112 L216,112 Q224,112 224,120 L224,140" fill="none" stroke="#596471" class="arrow"/>
<path d="M184,200 L216,200 Q224,200 224,192 L224,148" fill="none" stroke="#596471" class="arrow"/>
<path d="M228,144 L256,144" fill="none" stroke="#596471" marker-end="url(#reconcile-arrow)" class="arrow"/>
<path d="M384,144 L456,144" fill="none" stroke="#36577d" marker-end="url(#reconcile-accent)" class="arrow accent"/>
<path d="M320,184 L320,224" fill="none" stroke="#596471" marker-end="url(#reconcile-arrow)" class="arrow"/>
<path d="M320,104 L320,72" fill="none" stroke="#596471" marker-end="url(#reconcile-arrow)" class="arrow"/>
<rect x="408" y="124" width="24" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="420" y="134" text-anchor="middle" class="lbl accent">YES</text>
<rect x="334" y="198" width="20" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="344" y="208" text-anchor="middle" class="lbl">NO</text>
<rect x="338" y="82" width="60" height="12" rx="2" fill="#f7f8fa" class="paper"/>
<text x="368" y="92" text-anchor="middle" class="lbl">NO OUTCOME</text>
<rect x="24" y="88" width="160" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="88" width="160" height="48" rx="6" fill="#dedfe1" stroke="#596471" class="input"/>
<text x="104" y="110" text-anchor="middle" class="name">Recorded outcome</text>
<text x="104" y="124" text-anchor="middle" class="sub">outcome</text>
<rect x="24" y="176" width="160" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="176" width="160" height="48" rx="6" fill="#dedfe1" stroke="#596471" class="input"/>
<text x="104" y="198" text-anchor="middle" class="name">Judged failure cause</text>
<text x="104" y="212" text-anchor="middle" class="sub">failure_cause</text>
<circle cx="224" cy="144" r="4" fill="#25282e" class="dot"/>
<polygon points="256,144 320,104 384,144 320,184" fill="#f7f8fa" class="paper"/>
<polygon points="256,144 320,104 384,144 320,184" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="320" y="148" text-anchor="middle" class="name">Compatible?</text>
<rect x="456" y="120" width="160" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="456" y="120" width="160" height="48" rx="6" fill="#e8edf4" stroke="#36577d" class="focal"/>
<text x="536" y="148" text-anchor="middle" class="name">Agree</text>
<rect x="240" y="224" width="160" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="240" y="224" width="160" height="48" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="320" y="246" text-anchor="middle" class="name">Disagreement</text>
<text x="320" y="260" text-anchor="middle" class="sub">ranked by confidence</text>
<rect x="240" y="24" width="160" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="240" y="24" width="160" height="48" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="320" y="46" text-anchor="middle" class="name">Suggestion</text>
<text x="320" y="60" text-anchor="middle" class="sub">never written back</text>
</svg>
