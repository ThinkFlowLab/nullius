<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 464 520" width="464" height="520" role="img" aria-labelledby="builder-stages-title builder-stages-desc" class="dg">
<title id="builder-stages-title">The builder’s stages</title>
<desc id="builder-stages-desc">Eight stages in order, from the runner to the review, which runs the recipe here or on a host.</desc>
<defs><marker id="builder-stages-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#596471" class="head"/></marker><marker id="builder-stages-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#36577d" class="head accent"/></marker><marker id="builder-stages-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#596471" stroke-width="1.2" class="arrow"/></marker></defs>
<style>
.dg{--p:var(--paper,#f7f8fa);--i:var(--ink,#25282e);--m:var(--muted,#596471);--a:var(--md-typeset-a-color,#36577d);--n:#fff;
 --sans:'DM Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;--serif:'Instrument Serif',Georgia,serif}
[data-md-color-scheme=slate] .dg{--n:color-mix(in srgb,var(--i) 7%,var(--p))}
.dg .paper{fill:var(--p)}
.dg .zone{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 14%,transparent);stroke-width:.8}
.dg .eyebrow{fill:var(--m);font:500 8px var(--mono);letter-spacing:.14em}
.dg .box{fill:var(--n);stroke:var(--i);stroke-width:1}
.dg .focal{fill:color-mix(in srgb,var(--a) 12%,transparent);stroke:var(--a);stroke-width:1}
.dg .store{fill:color-mix(in srgb,var(--i) 5%,transparent);stroke:var(--m);stroke-width:1}
.dg .ext{fill:color-mix(in srgb,var(--i) 3%,transparent);stroke:color-mix(in srgb,var(--i) 40%,transparent);stroke-width:1}
.dg .input{fill:color-mix(in srgb,var(--m) 10%,transparent);stroke:var(--m);stroke-width:1}
.dg .name{fill:var(--i);font:500 12px var(--sans)}
.dg .sub{fill:var(--m);font:9px var(--mono)}
.dg .lbl{fill:var(--m);font:8px var(--mono);letter-spacing:.06em}
.dg .lbl.accent{fill:var(--a)}
.dg .arrow{fill:none;stroke:var(--m);stroke-width:1.2}
.dg .arrow.accent{stroke:var(--a)}
.dg .arrow.dashed{stroke-dasharray:5 4;stroke-width:1}
.dg .arrow.bus{stroke-width:1}
.dg .head{fill:var(--m)}
.dg .head.accent{fill:var(--a)}
.dg .dot{fill:var(--i)}
.dg .life{stroke:color-mix(in srgb,var(--i) 25%,transparent);stroke-width:1;stroke-dasharray:3 3}
.dg .act{fill:color-mix(in srgb,var(--i) 6%,transparent);stroke:var(--m);stroke-width:.8}
.dg .frame{fill:color-mix(in srgb,var(--i) 2%,transparent);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .tab{fill:var(--p);stroke:color-mix(in srgb,var(--i) 22%,transparent);stroke-width:1}
.dg .guard{fill:var(--m);font:8px var(--mono);letter-spacing:.04em}
.dg .note{fill:var(--m);font:13px var(--sans)}
.dg .rule{stroke:color-mix(in srgb,var(--i) 12%,transparent);stroke-width:.8}
.dg .legend{fill:var(--m);font:9px var(--sans)}
</style>
<rect width="100%" height="100%" fill="#f7f8fa" class="paper"/>
<path d="M96,60 L96,80" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,116 L96,136" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,172 L96,192" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,228 L96,248" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,284 L96,304" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,340 L96,360" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M96,396 L96,416" fill="none" stroke="#596471" marker-end="url(#builder-stages-arrow)" class="arrow"/>
<path d="M168,430 L204,430 Q212,430 212,422 L212,412 Q212,404 220,404 L240,404" fill="none" stroke="#36577d" marker-end="url(#builder-stages-accent)" class="arrow accent"/>
<rect x="24" y="24" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="24" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="46" text-anchor="middle" class="name">Runner</text>
<rect x="24" y="80" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="80" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="102" text-anchor="middle" class="name">Benchmark</text>
<rect x="24" y="136" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="136" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="158" text-anchor="middle" class="name">Dataset</text>
<rect x="24" y="192" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="192" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="214" text-anchor="middle" class="name">Agent</text>
<rect x="24" y="248" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="248" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="270" text-anchor="middle" class="name">Model</text>
<rect x="24" y="304" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="304" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="326" text-anchor="middle" class="name">Limits</text>
<rect x="24" y="360" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="360" width="144" height="36" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="96" y="382" text-anchor="middle" class="name">Where</text>
<rect x="24" y="416" width="144" height="36" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="24" y="416" width="144" height="36" rx="6" fill="#e8edf4" stroke="#36577d" class="focal"/>
<text x="96" y="438" text-anchor="middle" class="name">Review</text>
<rect x="240" y="380" width="200" height="48" rx="6" fill="#f7f8fa" class="paper"/>
<rect x="240" y="380" width="200" height="48" rx="6" fill="#ffffff" stroke="#25282e" class="box"/>
<text x="340" y="402" text-anchor="middle" class="name">Run</text>
<text x="340" y="416" text-anchor="middle" class="sub">here, or on a host</text>
</svg>
