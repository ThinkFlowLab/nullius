name: Bug
description: Something the application does wrong.
labels: ["bug"]
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Under 150 words, not counting images, quoted output and Acceptance. The point first, one fact per line, fragments are fine. Drop facts, not words. No key, email address or private link. A security problem goes to SECURITY.md's address instead.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 · Fix now: unsafe, loses money or data, or nothing runs"
        - "P1 · Next: a wrong result or a broken path, with no way around it"
        - "P2 · Planned: limited in scope, has a way around it, or a missing feature"
        - "P3 · When convenient: wording, layout, tests"
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: What was observed, quoted. A screenshot when it is visible.
      placeholder: |
        Run builder, Model: `Qwen 32b` says "No matching models". OpenRouter lists two.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: The fewest steps that show it.
      placeholder: |
        1. Run builder, GSM8K, provider OpenRouter.
        2. Model: type `Qwen 32b`.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      placeholder: Both Qwen 32B models are listed.
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: |
        One box per criterion, checkable in the diff; the judge gives each its own row. Example: `- [ ] Words match in any order and case`
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related
      description: What this waits on; the repository that owns the cause when it is not this one.
      placeholder: "#124"
