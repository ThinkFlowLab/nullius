name: Enhancement
description: Something the application should do, or do better.
labels: ["enhancement"]
type: Feature
body:
  - type: markdown
    attributes:
      value: |
        Under 150 words, not counting images, quoted output and Acceptance. The point first, one fact per line, fragments are fine. Drop facts, not words. No key, email address or private link. A security problem goes to SECURITY.md's address instead.
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0 · Fix now: unsafe, loses money or data, or nothing runs"
        - "P1 · Next: a wrong result or a broken path, with no way around it"
        - "P2 · Planned: limited in scope, has a way around it, or a missing feature"
        - "P3 · When convenient: wording, layout, tests"
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: Today
      description: What the application does now, quoted or pictured.
      placeholder: |
        Agents, Prove its ports: the Model field is plain text. No list.
    validations:
      required: true
  - type: textarea
    id: wanted
    attributes:
      label: Wanted
      description: What it should do, and for whom. A sketch when it is visible.
      placeholder: |
        The builder's model picker there, for the chosen provider.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: |
        One box per criterion, checkable in the diff; the judge gives each its own row. Example: `- [ ] The kits' form lists its provider's models`
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related
      description: What this waits on.
      placeholder: "#124"
