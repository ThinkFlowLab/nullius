# Publish only previously reviewed GitHub release downloads. Validation has no
# PyPI credential; the publishing job never builds or installs the application.
name: publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published prerelease tag matching pyproject.toml
        required: true
        default: v0.1.0rc1
        type: string
      confirm:
        description: Upload this reviewed prerelease to PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && inputs.confirm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.assets.outputs.version }}
      wheel_id: ${{ steps.assets.outputs.wheel_id }}
      wheel_name: ${{ steps.assets.outputs.wheel_name }}
      wheel_sha256: ${{ steps.assets.outputs.wheel_sha256 }}
      source_id: ${{ steps.assets.outputs.source_id }}
      source_name: ${{ steps.assets.outputs.source_name }}
      source_sha256: ${{ steps.assets.outputs.source_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install validation tool
        run: python -m pip install --quiet uv==0.13.1
      - name: Download and check published prerelease
        id: assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: >-
          python3 app/packaging/publish.py
          --repository "$GITHUB_REPOSITORY"
          --tag "$RELEASE_TAG"
          --out-dir "$RUNNER_TEMP/nullius-publish"
          --github-output "$GITHUB_OUTPUT"
      - name: Verify installed wheel
        run: python3 app/packaging/verify.py "$RUNNER_TEMP/nullius-publish/"*.whl
      - name: Check PyPI metadata and README
        run: >-
          uvx --from twine==6.2.0 twine check --strict
          "$RUNNER_TEMP/nullius-publish/"*.whl
          "$RUNNER_TEMP/nullius-publish/"*.tar.gz

  publish:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
      - name: Install publishing tool
        run: python -m pip install --quiet uv==0.13.1
      - name: Retrieve the exact verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
          WHEEL_ID: ${{ needs.validate.outputs.wheel_id }}
          WHEEL_NAME: ${{ needs.validate.outputs.wheel_name }}
          WHEEL_SHA256: ${{ needs.validate.outputs.wheel_sha256 }}
          SOURCE_ID: ${{ needs.validate.outputs.source_id }}
          SOURCE_NAME: ${{ needs.validate.outputs.source_name }}
          SOURCE_SHA256: ${{ needs.validate.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+rc[1-9][0-9]*$ ]]
          [[ "$WHEEL_ID" =~ ^[1-9][0-9]*$ && "$SOURCE_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$WHEEL_SHA256" =~ ^[0-9a-f]{64}$ && "$SOURCE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$WHEEL_NAME" == "nullius_eval-$RELEASE_VERSION-py3-none-any.whl" ]]
          [[ "$SOURCE_NAME" == "nullius_eval-$RELEASE_VERSION.tar.gz" ]]
          mkdir "$RUNNER_TEMP/nullius-publish"
          cd "$RUNNER_TEMP/nullius-publish"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$WHEEL_ID" \
            -H 'Accept: application/octet-stream' > "$WHEEL_NAME"
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$SOURCE_ID" \
            -H 'Accept: application/octet-stream' > "$SOURCE_NAME"
          printf '%s  %s\n' "$WHEEL_SHA256" "$WHEEL_NAME" "$SOURCE_SHA256" "$SOURCE_NAME" \
            | sha256sum --check --strict
      - name: Publish verified downloads with trusted publishing
        env:
          WHEEL_NAME: ${{ needs.validate.outputs.wheel_name }}
          SOURCE_NAME: ${{ needs.validate.outputs.source_name }}
        run: >-
          uv publish --no-config --trusted-publishing always
          --publish-url https://upload.pypi.org/legacy/
          "$RUNNER_TEMP/nullius-publish/$WHEEL_NAME"
          "$RUNNER_TEMP/nullius-publish/$SOURCE_NAME"
