# The docker tier of the backend suite: the tests that build and run
# containers for real (app/tests/docker_tier.py) - an agent in a task's own
# image, a unit's environment and licences, what a check may reach, the
# relay's network. Nightly and by hand, never on a pull request: the tests
# workflow skips them. Builds the standard's base image first; hosted runner
# time uses the account's Actions allowance.
name: docker tests

on:
  schedule:
    - cron: '47 2 * * *'  # Nightly at 02:47 UTC.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-tests-${{ github.ref }}
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NULLIUS_HOME: /tmp/nullius-test-profile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install test tool
        run: python -m pip install --quiet uv==0.13.1
      - name: base image
        # The standard's one base image, and the fixture own image's FROM.
        run: |
          PYTHONPATH=app python3 -c "from nullius.standard import container; print(container.base_image())"
          docker pull --quiet ubuntu:24.04
      - name: backend suite with the docker tier
        run: python3 app/tests/parallel.py --docker
