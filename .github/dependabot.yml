# Monthly grouped version updates; security alerts and updates are enabled
# separately in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directories:
      - /
      - /app
      - /app/site
    schedule:
      interval: monthly
    open-pull-requests-limit: 1
    groups:
      python:
        patterns: ["*"]
