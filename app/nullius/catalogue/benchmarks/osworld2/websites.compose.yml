name: osworld2-web

x-blkio: &blkio
  device_write_bps:
    - path: ${OSWORLD2_WEB_DISK:?the disk under Docker's root, as websites.py sets it}
      rate: ${OSWORLD2_WEB_QUIET_BPS:?as websites.py sets it}
  device_write_iops:
    - path: ${OSWORLD2_WEB_DISK:?the disk under Docker's root, as websites.py sets it}
      rate: ${OSWORLD2_WEB_QUIET_IOPS:?as websites.py sets it}

x-logging: &logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  awsconsole:
    blkio_config: *blkio
    logging: *logs
  budgetwise_web_backend:
    blkio_config: *blkio
    logging: *logs
  budgetwise_web_frontend:
    blkio_config: *blkio
    logging: *logs
  caddy:
    image: lucaslorentz/caddy-docker-proxy@sha256:33081120c6df8613cebbdbdd4c3b8aef641e9e56c1cd3d86d04ea9651cb3cc68
    ports: !override
      - ${OSWORLD2_WEB_ADDRESS:?the address Caddy listens on, as websites.py sets it}:80:80
    blkio_config:
      device_write_bps:
        - path: ${OSWORLD2_WEB_DISK:?the disk under Docker's root, as websites.py sets it}
          rate: ${OSWORLD2_WEB_CADDY_BPS:?as websites.py sets it}
      device_write_iops:
        - path: ${OSWORLD2_WEB_DISK:?the disk under Docker's root, as websites.py sets it}
          rate: ${OSWORLD2_WEB_CADDY_IOPS:?as websites.py sets it}
    logging: *logs
