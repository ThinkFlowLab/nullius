{% extends "base.html" %}
{% block htmltitle %}
<title>Nullius - Docs</title>
{% endblock %}
{% block extrahead %}
<link rel="home" href="{{ config.extra.homepage }}">
<link rel="apple-touch-icon" sizes="180x180" href="{{ 'assets/apple-touch-icon.png?v=3' | url }}">
<link rel="mask-icon" href="{{ 'assets/safari-pinned-tab.svg' | url }}" color="#8f98a8">
{% endblock %}
{% block content %}
{% if page.parent %}
<div class="doc-context">{{ page.parent.title }}</div>
{% endif %}
{{ super() }}
{% include "partials/footer.html" %}
{% endblock %}
{% block footer %}{% endblock %}
