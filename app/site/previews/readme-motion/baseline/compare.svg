<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d"><title id="t">Compare</title><desc id="d">Align shared tasks. Open the difference. Conceptual animation, not an evaluation result.</desc><style>text{font-family:Arial,sans-serif;fill:#dedfe2;font-size:17px} .muted{fill:#a1a7b1;font-size:13px}.line{stroke:#474d56;stroke-width:1.5;fill:none}.ink{stroke:#dedfe2;stroke-width:1.6;fill:none}.blue{stroke:#a7bddb;stroke-width:2;fill:none}.fill{fill:#202328;stroke:#474d56;stroke-width:1.5}.dot{fill:#a7bddb}.ok{stroke:#a6c5ad;fill:none;stroke-width:2}.warn{stroke:#dab47b;fill:none;stroke-width:2} .float{animation:float 6s cubic-bezier(.22,1,.36,1) infinite}.arrive{animation:arrive 6s cubic-bezier(.22,1,.36,1) infinite}.reveal{animation:reveal 6s ease infinite}.scan{animation:scan 6s ease-in-out infinite}.pulse{animation:pulse 6s ease infinite}.draw{stroke-dasharray:200;animation:draw 6s ease infinite}.left{animation:left 6s cubic-bezier(.22,1,.36,1) infinite}.right{animation:right 6s cubic-bezier(.22,1,.36,1) infinite}.delay{animation-delay:-2s}.delay2{animation-delay:-4s}.packet{animation:packet 6s ease-in-out infinite} .expand{animation:expand 6s cubic-bezier(.22,1,.36,1) infinite;transform-box:fill-box;transform-origin:center}.slide{animation:slide 6s ease-in-out infinite}
@keyframes float{0%,12%,92%,100%{transform:translateY(-12px)}40%,72%{transform:translateY(0)}}
@keyframes arrive{0%,10%,94%,100%{transform:translateX(-70px);opacity:.65}38%,76%{transform:translateX(0);opacity:1}}
@keyframes reveal{0%,24%,90%,100%{opacity:.4}40%,78%{opacity:1}}
@keyframes scan{0%,12%,100%{transform:translateX(-110px)}65%,82%{transform:translateX(110px)}}
@keyframes pulse{0%,25%,90%,100%{opacity:.5}42%,78%{opacity:1}}
@keyframes draw{0%,22%,100%{stroke-dashoffset:200;opacity:.2}50%,82%{stroke-dashoffset:0;opacity:1}}
@keyframes left{0%,10%,95%,100%{transform:translateX(-45px)}38%,80%{transform:translateX(0)}}
@keyframes right{0%,10%,95%,100%{transform:translateX(45px)}38%,80%{transform:translateX(0)}}
@keyframes packet{0%,8%{offset-distance:0%;opacity:0}15%{opacity:1}70%{offset-distance:100%;opacity:1}83%,100%{offset-distance:100%;opacity:0}}
@keyframes expand{0%,12%,96%,100%{transform:scaleX(.75);opacity:.6}42%,78%{transform:scaleX(1);opacity:1}}
@keyframes slide{0%,10%,95%,100%{transform:translateY(16px);opacity:.4}40%,80%{transform:translateY(0);opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;opacity:1!important}}</style><rect width="800" height="350" fill="#18191b"/><text x="264" y="83" text-anchor="middle">Run A</text><text x="536" y="83" text-anchor="middle">Run B</text>
<g class="left"><path d="M190 113H336V261H190Z" class="fill"/><path d="M213 140h66M213 182h66M213 225h66" class="line"/><circle cx="310" cy="140" r="4" class="dot"/><circle cx="310" cy="182" r="4" class="dot"/><circle cx="310" cy="225" r="4" class="dot"/></g>
<g class="right"><path d="M464 113H610V261H464Z" class="fill"/><path d="M487 140h66M487 182h66M487 225h66" class="line"/><circle cx="584" cy="140" r="4" class="dot"/><circle cx="584" cy="182" r="4" fill="#dab47b"/><circle cx="584" cy="225" r="4" class="dot"/></g>
<g class="reveal"><path d="M339 140H461M339 225H461" class="line"/><path d="M339 182H461" class="warn"/><circle cx="400" cy="182" r="16" fill="#18191b" stroke="#dab47b"/><path d="M395 178h10m-10 8h10m-7-12 4 16" class="warn"/></g><text x="400" y="303" text-anchor="middle" class="muted">Shared tasks · differences first</text></svg>