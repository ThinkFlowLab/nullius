{#- The interface's icons, included by base.html: one symbol each, referenced by <use href="#i-NAME">.
    Stroked in the item's colour (`.ic` in style.css), most with a tone under the strokes: the same colour at
    --ic-duo's opacity. A redrawn symbol holds three drawings, one per
    displayed size, each on its own grid and never scaled: a 16-grid and a 24-grid with a 1 px stroke, a 32-grid
    with a 2 px stroke, horizontal and vertical lines on whole pixels. Detail is only added as the size grows, never
    removed: what a smaller drawing shows, each larger one shows too. The size picks one through
    --ic-d16/--ic-d24/--ic-d32 (style.css).
    An alias is a second id for a symbol: its only child a <use> of it, never of another alias. #}
