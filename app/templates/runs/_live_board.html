{% macro live_panel(job_id, live_board=none, trial_base="", noun="") %}
<section class="lb" id="live-board" aria-label="Live board" data-state="{{ live_board.initial.state if live_board and live_board.initial else 'unknown' }}"
         data-endpoint="{{ url_for('job_live', job_id=job_id) }}"
         data-trial-base="{{ trial_base }}"
         data-noun="{{ noun }}">
  <div class="lb-headline">
    <span class="lb-state"><i aria-hidden="true"></i><span data-lb-state>{{ live_board.initial.state|capitalize if live_board and live_board.initial else '' }}</span></span>
    <span class="lb-clock" data-lb-head></span>
    <span class="lb-meta" data-lb-meta></span>
  </div>
  <div class="lb-stats" data-lb-stats></div>
  <div class="lb-mix">
    <div class="lb-mixbar" data-lb-mixbar role="img" aria-label="Outcome mix of finished trials, as the feed reports them"></div>
    <ul class="lb-legend" data-lb-legend aria-label="Filter trials by outcome"></ul>
    <div class="lb-lanes" data-lb-lanes hidden></div>
  </div>
  <div class="lb-body">
    <div class="lb-main">
      <div class="lb-tiles-wrap"><span data-lb-tiles-label>All trials</span><div class="lb-tiles" data-lb-tiles></div></div>
      <div data-lb-flight></div>
    </div>
    <aside class="lb-drawer" data-lb-drawer aria-label="Trial detail" hidden></aside>
  </div>
  <p class="lb-foot" data-lb-foot hidden><span data-lb-status></span></p>
</section>
<script id="live-board-initial" type="application/json">{{ (live_board.initial if live_board else none) | tojson }}</script>
{% endmacro %}
